# CI cho repo public: GitHub Actions (miễn phí với repo public). Không dùng Woodpecker tự host
# vì PR từ fork lạ sẽ chạy trên máy prod.
# Test hồi quy dùng stub Chrome/DOM và đồng hồ giả, không gọi YouTube hay dịch vụ dịch thật.
# Action ghim SHA, đo 08/11/2026.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test tests/regression.test.cjs
